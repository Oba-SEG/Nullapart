<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/app/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/brand/app/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/app/apple-touch-icon-180.png"
    />
    <link rel="icon" href="/brand/app/favicon.ico" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#eef1f5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nullapart - Secure Email Gateway</title>
    <meta
      name="description"
      content="Security-first bidirectional Secure Email Gateway"
    />
    <!--
      `frame-ancestors`, `base-uri` and `form-action` are enforced only by the
      response header (frontend/nginx.conf, docker/nginx.conf); a <meta> CSP
      cannot carry them, the browser ignores them there. `vite dev` serves no
      CSP header because React Fast Refresh needs an inline script preamble that
      `script-src 'self'` would block, so this meta is the floor for every other
      origin that serves the bundle. Never relax it relative to the header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
