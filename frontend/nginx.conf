server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The development gateway authenticates *only* the proxy-header login
    # exchange. This keeps the browser's native Basic Auth popup off the
    # branded login page and lets the React login form submit credentials for
    # one same-origin request. The browser's Basic value never reaches Mail
    # Core: each upstream request is overwritten with the workload bearer.
    #
    # GET deliberately remains unauthenticated here. In an OIDC deployment it
    # is the real top-level redirect entrypoint; in proxy-header mode it cannot
    # establish a session without the POST-only local identity handoff.
    location = /api/v1/auth/login {
        limit_except GET {
            auth_basic "Nullapart local development";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        proxy_pass http://mailcore:8081;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${NULLAPART_LOCAL_CONTROL_TOKEN}";
        proxy_set_header X-Nullapart-Local-User $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy to Mail Core. Requests other than the exact login exchange
    # may never supply a local identity header themselves; authorization comes
    # from the server-managed session and is rechecked by Mail Core.
    location /api/ {
        proxy_pass http://mailcore:8081;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${NULLAPART_LOCAL_CONTROL_TOKEN}";
        proxy_set_header X-Nullapart-Local-User "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
