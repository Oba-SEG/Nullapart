server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Local/dev browser authentication is separate from the Mail Core
    # workload bearer token injected below. Browser clients never receive the
    # workload credential.
    auth_basic "Nullapart local development";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Mail Core
    location /api/ {
        proxy_pass http://mailcore:8081;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer ${NULLAPART_LOCAL_CONTROL_TOKEN}";
        # Basic-authenticated identity from the outer proxy layer. Mail Core
        # trusts this header only behind the workload bearer token.
        proxy_set_header X-Nullapart-Local-User $remote_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
