# Nullapart local dev stack
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nullapart
      POSTGRES_USER: nullapart
      POSTGRES_PASSWORD: nullapart_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullapart"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailcore:
    build:
      context: .
      dockerfile: docker/Dockerfile.mailcore
    ports:
      - "8081:8081"
    environment:
      NULLAPART_DEPLOYMENT_ID: "dev-local"
      NULLAPART_NODE_ID: "mailcore-dev-01"
      NULLAPART_ENVIRONMENT: "dev"
      NULLAPART_HANDOFF_HMAC_SECRET: "dev-hmac-secret-not-for-production"
      NULLAPART_HANDOFF_HMAC_KEY_ID: "mail-handoff-v1"
      NULLAPART_MAILCORE_HANDOFF_URL: "http://127.0.0.1:8081/internal/handoff"
      NULLAPART_HANDOFF_MAX_BYTES: "52428800"
      DATABASE_URL: "postgresql://nullapart:nullapart_dev@postgres:5432/nullapart"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postfix:
    build:
      context: .
      dockerfile: docker/Dockerfile.postfix
    ports:
      - "2525:25"
      - "465:465"
      - "587:587"
    environment:
      NULLAPART_DEPLOYMENT_ID: "dev-local"
      NULLAPART_NODE_ID: "postfix-dev-01"
    depends_on:
      - mailcore

  rspamd:
    build:
      context: .
      dockerfile: docker/Dockerfile.rspamd

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3080:80"
    depends_on:
      - mailcore

volumes:
  pgdata:
  redisdata:
