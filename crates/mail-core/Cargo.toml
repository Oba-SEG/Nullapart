[package]
name = "nullapart-mail-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nullapart-mail-contracts = { path = "../mail-contracts" }
nullapart-policy = { path = "../policy" }
nullapart-scanner-sdk = { path = "../scanner-sdk" }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
hmac = "0.12"
sha2 = "0.10"
hex = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
mailparse = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quircs = "0.10"
flate2 = "1.0"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
tokenizers = "0.23.2"
quick-xml = "0.38"

[dev-dependencies]
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["getrandom"] }
base64 = { workspace = true }
tower = { version = "0.5", features = ["util"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
