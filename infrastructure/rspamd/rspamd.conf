# Nullapart Rspamd main configuration
# Bounded Milter stage for SMTP session-safe work only.
# Follows: docs/phases/PHASE-1-EXECUTION-PLAN.md Work Package 3

# ==============================================================================
# General
# ==============================================================================
bind_socket = "127.0.0.1:11332";
pidfile = "/run/rspamd/rspamd.pid";
timeout = 30 seconds;
uid = "rspamd";
gid = "rspamd";

# ==============================================================================
# Logging
# ==============================================================================
log {
    type = "file"
    filename = "/var/log/rspamd/rspamd.log"
    level = "info"
}

# ==============================================================================
# Milter protocol
# ==============================================================================
milter {
    timeout = 15 seconds;
    max_message_size = 52428800;  # 50MB, matches Postfix
}

# ==============================================================================
# Worker — milter mode (receives from Postfix)
# ==============================================================================
worker "milter" {
    bind_socket = "127.0.0.1:11332";
    timeout = 15 seconds;
}

# ==============================================================================
# Actions — Rspamd scoring thresholds
# ==============================================================================
actions {
    reject {
        score = 15.0;
        action = "reject";
    }
    add_header {
        score = 8.0;
        action = "add header";
    }
    greylist {
        score = 4.0;
        action = "greylist";
    }
}

# ==============================================================================
# Groups configuration — bounded to session-safe work only
# ==============================================================================
# NON-responsibilities (do NOT enable):
# - document parsing (oletools, freshclam)
# - OCR
# - archive recursion
# - Deep AI / slow external enrichments
# - tenant-specific final disposition

group {
    name = "nullapart-bounded";

    # Spam/reputation evidence (fast, session-safe)
    include "groups/spam_score.conf";
    include "groups/rbl.conf";

    # Authentication-related evidence
    include "groups/arc.conf";
    include "groups/dkim.conf";
    include "groups/dmarc.conf";
    include "groups/spf.conf";

    # Fuzzy/campaign signals (meets latency budget)
    include "groups/fuzzy.conf";

    # Message/header characteristics
    include "groups/headers.conf";

    # Greylisting hooks (if used)
    include "groups/greylist.conf";
}

# ==============================================================================
# Symbol overrides — custom scoring for Nullapart-specific thresholds
# ==============================================================================
override {
    # Spam thresholds (aligned with actions block)
    THRESHOLD_HIGH {
        score = 8.0;
        description = "High spam probability";
    }
    THRESHOLD_LOW {
        score = 4.0;
        description = "Low spam probability";
    }

    # Authentication failures
    SPF_FAIL {
        score = 2.5;
        description = "SPF check failed";
    }
    DKIM_FAIL {
        score = 2.0;
        description = "DKIM verification failed";
    }
    DMARC_FAIL {
        score = 3.0;
        description = "DMARC check failed";
    }
}

# ==============================================================================
# RBL configuration (bounded, fast lookups only)
# ==============================================================================
rbl {
    enabled = true;
    timeout = 2 seconds;
    # Only include fast, reliable RBLs
    servers {
        zen_spamhaus = "zen.spamhaus.org";
        bl_spamcop = "bl.spamcop.net";
    }
}

# ==============================================================================
# Greylisting
# ==============================================================================
greylist {
    enabled = false;  # Enable after validation
    timeout = 300 seconds;
}

# ==============================================================================
# Fuzzy check (fast, local hash-based)
# ==============================================================================
fuzzy {
    enabled = true;
    timeout = 2 seconds;
    backend = "sqlite";
    db = "/var/lib/rspamd/fuzzy.db";
}
