# SMTP-stage Rspamd supplies bounded evidence and headers only. Mail Core owns
# durable scanning and tenant-aware final disposition after queue acceptance.
#
# reject stays disabled (1000): an SMTP-stage reject would take disposition
# authority away from Mail Core and could drop mail without tenant-scoped
# audit or quarantine. greylist stays disabled for the same reason.
#
# add_header = 6 is the evidence band: at or above it, the Nullapart lua
# evidence chain (lua.d/nullapart_evidence.lua) attaches score/action/symbol
# headers that the after-queue mailcore-filter forwards over the
# HMAC-authenticated handoff, and Mail Core records the spam verdict.
reject = 1000;
add_header = 6;
greylist = 998;
