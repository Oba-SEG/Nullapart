# DKIM signing is restricted to the private Mail Core outbound submission
# source. Rspamd receives the original SMTP client address from Postfix's
# milter protocol, so Internet SMTP clients and the after-queue reinjection
# listener cannot select this signing path.
#
# Per-domain selector/key maps and private keys are mounted at runtime from the
# approved secrets boundary. No key material belongs in the image or Git.
sign_local = false;
sign_authenticated = false;
sign_networks = ["172.30.0.10"];
use_domain_sign_networks = "envelope";
allow_envfrom_empty = false;
allow_hdrfrom_mismatch = false;
# The Postfix milter must receive the generated header, not only Rspamd's
# internal DKIM_SIGNED result symbol. Without this, a configured signer can
# report success while the queued message remains unsigned.
use_milter_headers = true;
use_esld = false;
try_fallback = false;
selector_map = "file:///run/nullapart/dkim/selectors.map";
path_map = "file:///run/nullapart/dkim/paths.map";
