[workspace]
resolver = "2"
members = [
    "crates/mail-contracts",
    "crates/mail-core",
    "crates/policy",
    "crates/scanner-sdk",
    "crates/observability",
]
# cargo-fuzz manages its own workspace and requires nightly; keeping it out
# of the main workspace avoids forcing nightly on regular CI.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nullapart Team <team@nullapart.com>"]
license = "proprietary"
repository = "https://github.com/obakeng-SEG/Nullapart"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono"] }

# HTTP
axum = "0.7"
tower = "0.5"

# Utilities
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2.6"

# Validation
validator = { version = "0.18", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true