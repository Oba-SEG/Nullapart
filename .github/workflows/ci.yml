name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "security/**"
      - "infra/**"
      - "docs/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  security:
    name: Dependency and image security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: security-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            security-${{ runner.os }}-
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Advisory audit
        # openidconnect 4.x requires rsa 0.9.x. RustSec has no fixed release
        # for RUSTSEC-2023-0071, so this single exception remains visible in
        # CI while every advisory with an available remediation still fails.
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Trivy filesystem scan (critical gate)
        # v0.29.0 depended on a setup-trivy tag that GitHub can no longer resolve.
        # This release pins its setup dependency by immutable commit as well.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln,secret
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Bounded fuzz runs (handoff, DMARC, milter evidence)
        run: |
          set -eu
          for target in handoff_request dmarc_aggregate milter_evidence_headers; do
            cargo +nightly fuzz run "$target" -- -max_total_time=45 -timeout=10
          done

  compose-smoke:
    name: Inline ML fixture and filter wrapper smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            smoke-${{ runner.os }}-
      - name: Generate inline-ML fixture
        run: |
          pip install --quiet onnx numpy
          python crates/mail-core/tests/fixtures/make_inline_ml_fixture.py "$RUNNER_TEMP/inline-ml-fixture"
      - name: Fixture model load and inference contract
        env:
          NULLAPART_INLINE_ML_FIXTURE_DIR: ${{ runner.temp }}/inline-ml-fixture
        run: cargo test -p nullapart-mail-core --test inline_ml_fixture_smoke -- --ignored
      - name: Build mailcore-filter
        run: cargo build -p nullapart-mail-core --bin mailcore-filter
      - name: Filter selftest and wrapper EX_TEMPFAIL on broken binary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/filter-smoke"
          cp target/debug/mailcore-filter "$RUNNER_TEMP/filter-smoke/mailcore-filter"
          cp docker/mailcore-filter-wrapper.sh "$RUNNER_TEMP/filter-smoke/wrapper"
          chmod +x "$RUNNER_TEMP/filter-smoke/wrapper"
          "$RUNNER_TEMP/filter-smoke/mailcore-filter" --selftest
          cp target/debug/mailcore-filter "$RUNNER_TEMP/filter-smoke/mailcore-filter.broken"
          truncate -s 0 "$RUNNER_TEMP/filter-smoke/mailcore-filter.broken"
          set +e
          NULLAPART_MAILCORE_FILTER_BIN="$RUNNER_TEMP/filter-smoke/mailcore-filter.broken" \
            "$RUNNER_TEMP/filter-smoke/wrapper" \
            --queue-id CI-SMOKE --client-address 192.0.2.1 \
            --client-helo example.net --sender smoke@example.com \
            -- alice@phase2.test
          status=$?
          set -e
          test "$status" -eq 75

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Format
        working-directory: frontend
        run: pnpm format-check
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build

  contracts:
    name: Contract verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Verify workspace compiles
        run: cargo check --workspace
      - name: Run contract tests
        run: cargo test -p nullapart-mail-contracts

  sbom:
    name: SBOM and provenance
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          toolchain: 1.96.0
      - name: Build release workspace
        run: cargo build --workspace --release
      - name: Generate Rust CycloneDX SBOMs
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --all --format json
      - name: Prepare SBOM directory
        run: mkdir -p sbom
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom/source-sbom.spdx.json
      - name: Generate build provenance
        # GitHub does not offer attestation persistence to user-owned private
        # repositories. Keep the real attestation mandatory wherever the
        # platform supports it; the private-repository fallback below records
        # the limitation rather than claiming an unsigned file is an
        # attestation.
        if: ${{ github.event.repository.private == false || github.event.repository.owner.type != 'User' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # Attest distributable executables only. `target/release/*` also
          # expands to dependency artefacts and exceeds GitHub's 1,024-subject
          # attestation limit.
          subject-path: |
            target/release/mailcore-filter
            target/release/mailcore-server
      - name: Record unavailable GitHub attestation
        if: ${{ github.event.repository.private && github.event.repository.owner.type == 'User' }}
        run: |
          cat > sbom/PROVENANCE-NOT-ATTESTED.md <<EOF
          # GitHub build attestation unavailable

          GitHub Actions does not persist build attestations for a user-owned private repository.
          This file is an explicit limitation record, not an attestation and not a release approval.
          A release or deployment must require a real trusted attestation after the repository
          is public or is owned by an eligible organization.

          Source revision: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Executable SHA-256:
          EOF
          sha256sum target/release/mailcore-filter target/release/mailcore-server >> sbom/PROVENANCE-NOT-ATTESTED.md
          echo "::warning::GitHub build attestations are unavailable for this user-owned private repository; see the retained limitation record."
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            sbom/
            crates/**/*.cdx.json
          retention-days: 90
      - name: Scan SBOM for critical vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        id: scan
        with:
          sbom: sbom/source-sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
      - name: Upload vulnerability scan
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-scan
          path: ${{ steps.scan.outputs.sarif }}
          retention-days: 30
